name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Checkstyle, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # GitHub-hosted Ubuntu runners ship Docker, so the Testcontainers *IT suites run here too.
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  compose-smoke:
    name: Docker Compose stack + smoke test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke / acceptance test
        run: python3 scripts/smoke_test.py
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Tear down
        if: always()
        run: docker compose down -v
