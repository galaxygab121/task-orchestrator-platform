spring:
  application:
    name: orchestrator-api
  config:
    import: classpath:orchestrator-defaults.yml
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
