spring:
  application:
    name: scheduler-service
  config:
    import: classpath:orchestrator-defaults.yml
  kafka:
    consumer:
      group-id: scheduler-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: ${SERVER_PORT:8081}

scheduler:
  max-in-flight: ${SCHEDULER_MAX_IN_FLIGHT:8}
  dispatch-batch-size: ${SCHEDULER_DISPATCH_BATCH_SIZE:20}
  dispatch-interval-ms: ${SCHEDULER_DISPATCH_INTERVAL_MS:1000}
  lease-reaper-interval-ms: ${SCHEDULER_LEASE_REAPER_INTERVAL_MS:5000}
  reaper-batch-size: ${SCHEDULER_REAPER_BATCH_SIZE:50}
  listener-concurrency: ${SCHEDULER_LISTENER_CONCURRENCY:1}
  leader-lock-ttl: ${SCHEDULER_LEADER_LOCK_TTL:10s}
  instance-id: ${HOSTNAME:scheduler-service}
